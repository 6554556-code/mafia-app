<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мафия — нет связи</title>
<style>
  /* Экран «нет сети»: показывается вместо игры, если app.iplaymafia.com не открылся (авиарежим, нет интернета).
     Лежит внутри приложения — работает без сети. */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0f1424;color:#2c2c28;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    display:grid;place-items:center;padding:20px;-webkit-user-select:none;user-select:none}
  .card{width:100%;max-width:360px;background:#f2efe6;border:3px solid #2c2c28;
    box-shadow:inset 0 0 0 2px #f2efe6,4px 4px 0 rgba(0,0,0,.35);padding:24px 20px;text-align:center}
  .ico{font-size:52px;line-height:1;animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  h1{font-size:20px;margin:14px 0 8px;letter-spacing:.5px}
  p{font-size:14px;line-height:1.55;color:#5a5a52;margin:0 0 6px}
  button{width:100%;margin-top:16px;padding:13px 0;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:1px;
    background:#b5352c;color:#fff;border:2px solid #2c2c28;box-shadow:3px 3px 0 rgba(44,44,40,.25);cursor:pointer}
  button:active{transform:translate(1px,1px)}
  button:disabled{opacity:.6}
  .hint{margin-top:12px;font-size:12px;min-height:1.4em}
</style>
</head>
<body>
  <main class="card" role="alert">
    <div class="ico">📡</div>
    <h1>Деревня осталась без связи</h1>
    <p>Ночь, туман, и до сервера не дозвониться.</p>
    <p>Проверь интернет — мафия подождёт.</p>
    <button id="retry">ПОПРОБОВАТЬ ЕЩЁ</button>
    <p class="hint" id="hint"></p>
  </main>
<script>
  const GAME = "https://app.iplaymafia.com/";
  const btn = document.getElementById("retry"), hint = document.getElementById("hint");
  function retry(){
    if (!navigator.onLine) { hint.textContent = "Интернета пока нет 🌙"; return; }
    btn.disabled = true; hint.textContent = "Стучимся в дверь…";
    location.href = GAME;
  }
  btn.onclick = retry;
  // сеть вернулась сама — сразу возвращаемся в игру
  window.addEventListener("online", () => { hint.textContent = "Связь есть — возвращаемся…"; setTimeout(retry, 600); });
</script>
</body>
</html>
